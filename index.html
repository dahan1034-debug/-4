<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mountain Thunder — Eagles of the Peaks</title>
  <style>
    :root {
      color-scheme: dark;
      --panel: rgba(7, 15, 22, 0.74);
      --glow: #7de9f8;
      --danger: #ff5b6b;
      --warn: #ffcf5d;
      --ok: #7ef3ae;
      --text: #edf8ff;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #08131a;
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    #game-root {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #hud {
      position: fixed;
      top: 14px;
      left: 14px;
      width: 300px;
      padding: 12px 14px;
      background: var(--panel);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.24);
      z-index: 5;
      backdrop-filter: blur(6px);
      pointer-events: none;
    }

    #hud-title {
      display: block;
      margin-bottom: 6px;
      font-size: 11px;
      letter-spacing: 0.18em;
      color: var(--glow);
      text-transform: uppercase;
    }

    #status {
      font-size: 12px;
      line-height: 1.7;
      white-space: pre-line;
    }

    #message {
      position: fixed;
      left: 50%;
      top: 18px;
      transform: translateX(-50%);
      min-width: 260px;
      max-width: 70vw;
      padding: 10px 16px;
      border-radius: 7px;
      background: rgba(12, 28, 38, 0.82);
      border: 1px solid rgba(255,255,255,0.15);
      color: var(--text);
      z-index: 20;
      text-align: center;
      font-weight: 700;
      letter-spacing: 0.06em;
      display: none;
      text-transform: uppercase;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    }

    #controls {
      position: fixed;
      right: 20px;
      bottom: 18px;
      width: 260px;
      padding: 10px 12px;
      background: rgba(5, 15, 20, 0.68);
      color: #dfeef8;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.7;
      z-index: 6;
      pointer-events: none;
    }

    .ok { color: var(--ok); }
    .warn { color: var(--warn); }
    .danger { color: var(--danger); }
  </style>
</head>
<body>
  <div id="game-root"></div>

  <div id="hud">
    <span id="hud-title">Mountain Thunder</span>
    <div id="status"></div>
  </div>

  <div id="message"></div>

  <div id="controls">
    W/S pitch · A/D roll · Q/E yaw<br />
    Shift/Ctrl throttle · Space afterburner<br />
    F fire missile · G flare · R reset · H HUD
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
